        /* Pengaturan Dasar & Tema Warna */
        :root {
            --black: #0f0f0f;
            --gold: #d4af37;
            --gold-light: #ffd700;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Gradasi elegan hitam ke abu-abu gelap dengan aksen emas */
            background: linear-gradient(135deg, var(--black) 0%, #2a2824 50%, var(--black) 100%);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Container Utama */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--gold);
        }

        h1 {
            font-size: 3em;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.2em;
            color: var(--white);
            font-weight: 300;
        }

        /* Grid Layout untuk Konten */

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 50px;
        }
